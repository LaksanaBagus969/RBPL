<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Navagreen Logistics</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app-layout" id="appLayout">
  <div id="sidebarContainer"></div>
  <main class="app-main">
    <div id="navbarContainer"></div>
    <div class="page-content">
      <!-- Page Header -->
      <div class="page-header animate-fade-up">
        <div class="page-header-left">
          <h2>Dashboard</h2>
          <p>Ringkasan operasional logistik hari ini</p>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-secondary btn-sm">${Icons.download} Export</button>
          <button class="btn btn-primary btn-sm">${Icons.plus} Dokumen Baru</button>
        </div>
      </div>

      <!-- KPI Cards -->
      <div class="stats-grid" id="kpiGrid">
        <div class="stat-card animate-fade-up delay-1">
          <div class="stat-card-icon green">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5v8h1"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
          </div>
          <div class="stat-card-label">Total Pengiriman</div>
          <div class="stat-card-value" data-count="1248" data-suffix="">0</div>
          <div class="stat-card-trend up">↑ +12.5% dari bulan lalu</div>
        </div>
        <div class="stat-card animate-fade-up delay-2">
          <div class="stat-card-icon blue">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <div class="stat-card-label">Tingkat Keberhasilan</div>
          <div class="stat-card-value" data-count="94.8" data-suffix="%">0</div>
          <div class="stat-card-trend up">↑ +2.1% dari bulan lalu</div>
        </div>
        <div class="stat-card animate-fade-up delay-3">
          <div class="stat-card-icon red">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          </div>
          <div class="stat-card-label">Gagal Kirim</div>
          <div class="stat-card-value" data-count="18" data-suffix="">0</div>
          <div class="stat-card-trend down">↓ -8.3% dari bulan lalu</div>
        </div>
        <div class="stat-card animate-fade-up delay-4">
          <div class="stat-card-icon amber">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div class="stat-card-label">Rata-rata Waktu</div>
          <div class="stat-card-value" data-count="2.4" data-suffix=" hari">0</div>
          <div class="stat-card-trend up">↑ -0.3 hari lebih cepat</div>
        </div>
      </div>

      <!-- Charts Row -->
      <div class="charts-grid animate-fade-up delay-5">
        <div class="chart-card">
          <div class="chart-card-header">
            <div class="chart-card-title">Pengiriman Mingguan</div>
            <div class="flex gap-2">
              <button class="btn btn-ghost btn-sm" style="font-size:12px;padding:4px 10px">Minggu Ini</button>
              <button class="btn btn-ghost btn-sm" style="font-size:12px;padding:4px 10px;color:var(--text-muted)">Minggu Lalu</button>
            </div>
          </div>
          <canvas id="shipmentChart" height="260"></canvas>
        </div>
        <div class="chart-card">
          <div class="chart-card-header">
            <div class="chart-card-title">Status Pengiriman</div>
          </div>
          <canvas id="statusChart" height="260"></canvas>
        </div>
      </div>

      <!-- Second Charts Row + Activity -->
      <div class="charts-grid-equal animate-fade-up delay-6">
        <div class="chart-card">
          <div class="chart-card-header">
            <div class="chart-card-title">Tren Bulanan</div>
          </div>
          <canvas id="monthlyChart" height="220"></canvas>
        </div>
        <div class="activity-feed">
          <div class="chart-card-header" style="margin-bottom:16px">
            <div class="chart-card-title">Aktivitas Terbaru</div>
            <button class="btn btn-ghost btn-sm" style="font-size:12px;padding:4px 10px">Lihat Semua</button>
          </div>
          <div id="activityFeed"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
App.init();
if (!App.currentUser) { window.location.href = 'index.html'; }

// Render layout
document.getElementById('sidebarContainer').innerHTML = renderSidebar('dashboard.html');
document.getElementById('navbarContainer').innerHTML = renderNavbar('<span>Home</span> <span style="color:var(--gray-300)">/</span> <span>Dashboard</span>');

// Fix icons in page header buttons (rendered before Icons loaded from inline)
document.querySelector('.page-header-actions').innerHTML = `
  <button class="btn btn-secondary btn-sm">${Icons.download} Export</button>
  <button class="btn btn-primary btn-sm">${Icons.plus} Dokumen Baru</button>
`;

initLayout();

// Animate KPI counters
document.querySelectorAll('.stat-card-value[data-count]').forEach(el => {
  const target = parseFloat(el.dataset.count);
  const suffix = el.dataset.suffix || '';
  setTimeout(() => animateCounter(el, target, 1500, suffix), 400);
});

// ============ CHARTS ============
const chartColors = {
  primary: '#10b981',
  primaryLight: 'rgba(16, 185, 129, 0.1)',
  blue: '#3b82f6',
  blueLight: 'rgba(59, 130, 246, 0.1)',
  gray: '#94a3b8',
};

// Shipment Chart (Line)
new Chart(document.getElementById('shipmentChart'), {
  type: 'line',
  data: {
    labels: MOCK_CHART_SHIPMENTS.labels,
    datasets: [{
      label: 'Minggu Ini',
      data: MOCK_CHART_SHIPMENTS.data,
      borderColor: chartColors.primary,
      backgroundColor: chartColors.primaryLight,
      borderWidth: 2.5,
      fill: true,
      tension: 0.4,
      pointRadius: 4,
      pointHoverRadius: 6,
      pointBackgroundColor: '#fff',
      pointBorderColor: chartColors.primary,
      pointBorderWidth: 2,
    }, {
      label: 'Minggu Lalu',
      data: MOCK_CHART_SHIPMENTS.lastWeek,
      borderColor: chartColors.gray,
      backgroundColor: 'transparent',
      borderWidth: 1.5,
      borderDash: [5, 5],
      tension: 0.4,
      pointRadius: 0,
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#0f172a',
        titleFont: { family: 'Inter', size: 12 },
        bodyFont: { family: 'Inter', size: 12 },
        padding: 12,
        cornerRadius: 8,
        displayColors: false,
      }
    },
    scales: {
      x: { grid: { display: false }, ticks: { font: { family: 'Inter', size: 12 }, color: '#94a3b8' } },
      y: { grid: { color: '#f1f5f9' }, ticks: { font: { family: 'Inter', size: 12 }, color: '#94a3b8' }, border: { display: false } }
    }
  }
});

// Status Chart (Doughnut)
new Chart(document.getElementById('statusChart'), {
  type: 'doughnut',
  data: {
    labels: MOCK_CHART_STATUS.labels,
    datasets: [{
      data: MOCK_CHART_STATUS.data,
      backgroundColor: MOCK_CHART_STATUS.colors,
      borderWidth: 0,
      hoverOffset: 6,
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    cutout: '72%',
    plugins: {
      legend: {
        position: 'bottom',
        labels: { font: { family: 'Inter', size: 12 }, padding: 16, usePointStyle: true, pointStyleWidth: 8 }
      },
      tooltip: {
        backgroundColor: '#0f172a',
        titleFont: { family: 'Inter', size: 12 },
        bodyFont: { family: 'Inter', size: 12 },
        padding: 12,
        cornerRadius: 8,
      }
    }
  }
});

// Monthly Chart (Bar)
new Chart(document.getElementById('monthlyChart'), {
  type: 'bar',
  data: {
    labels: MOCK_CHART_MONTHLY.labels,
    datasets: [{
      label: 'Pengiriman',
      data: MOCK_CHART_MONTHLY.data,
      backgroundColor: 'rgba(16, 185, 129, 0.7)',
      borderRadius: 6,
      borderSkipped: false,
      barThickness: 32,
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: { backgroundColor: '#0f172a', titleFont: { family: 'Inter', size: 12 }, bodyFont: { family: 'Inter', size: 12 }, padding: 12, cornerRadius: 8 }
    },
    scales: {
      x: { grid: { display: false }, ticks: { font: { family: 'Inter', size: 12 }, color: '#94a3b8' } },
      y: { grid: { color: '#f1f5f9' }, ticks: { font: { family: 'Inter', size: 12 }, color: '#94a3b8' }, border: { display: false } }
    }
  }
});

// Activity Feed
const feedEl = document.getElementById('activityFeed');
feedEl.innerHTML = MOCK_ACTIVITIES.map(a => `
  <div class="activity-item">
    <div class="activity-icon ${a.type}">${a.icon}</div>
    <div>
      <div class="activity-text">${a.text}</div>
      <div class="activity-time">${a.time}</div>
    </div>
  </div>
`).join('');
</script>
</body>
</html>
